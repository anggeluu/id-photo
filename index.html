<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>증명사진 가이드라인 생성기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    background: #f2f4f7;
    color: #222;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    gap: 12px;
    width: 100%;
  }

  /* 상단 깔끔한 컨트롤 바 (모바일/PC 공용) */
  .controls {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid #eee;
    padding-bottom: 10px;
    gap: 8px;
  }
  .top-bar h2 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .btn-save {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-save:active { background: #1d4ed8; }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: #444;
  }
  .color-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .color-group input[type="color"] {
    width: 30px;
    height: 26px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  .btn-toggle-text {
    background: #f1f3f5;
    border: 1px solid #ddd;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #333;
    cursor: pointer;
  }

  .label-editor {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding-top: 6px;
    border-top: 1px dashed #e5e7eb;
  }
  .label-editor.open { display: grid; }
  .label-editor input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
  }

  .tip-line {
    font-size: 11.5px;
    color: #666;
    background: #f8f9fa;
    padding: 7px 10px;
    border-radius: 8px;
    line-height: 1.45;
  }

  .btn-pack {
    background: #111;
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }

  /* 포스터가 기기 화면 폭 안에 100% 들어오도록 감싸는 영역 */
  .stage {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
  }
  .preview-wrapper {
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    border-radius: 4px;
    background: #fff;
  }
  #poster {
    width: 680px;
    height: 980px;
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    user-select: none;
    overflow: hidden;
    background: linear-gradient(to bottom, #ffffff 0%, #f3bcc6 100%);
  }

  .poster-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }

  .photo-slot {
    position: absolute;
    background: #ffffff;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    touch-action: none;
  }
  .photo-slot:hover {
    outline: 2px dashed #d92638;
    outline-offset: -2px;
  }
  .photo-slot .placeholder {
    color: #888;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    pointer-events: none;
    line-height: 1.45;
  }
  .photo-slot img {
    position: absolute;
    max-width: none;
    transform-origin: center center;
    cursor: grab;
  }
  .photo-slot img:active { cursor: grabbing; }

  .slot-0 { left: 403px; top: 35px; width: 245px; height: 310px; }
  .slot-1 { left: 82px;  top: 421px; width: 162px; height: 205px; }
  .slot-2 { left: 261px; top: 421px; width: 162px; height: 205px; }
  .slot-3 { left: 439px; top: 421px; width: 162px; height: 205px; }
  .slot-4 { left: 82px;  top: 683px; width: 162px; height: 205px; }
  .slot-5 { left: 261px; top: 683px; width: 162px; height: 205px; }
  .slot-6 { left: 439px; top: 683px; width: 162px; height: 205px; }

  .caption-box {
    position: absolute;
    z-index: 3;
    width: 162px;
    text-align: center;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: -1.4px;
    color: #111;
    cursor: text;
    padding: 2px 4px;
    border-radius: 4px;
    outline: none;
    transform: scaleX(0.96);
  }
  .caption-box:hover, .caption-box:focus {
    background: rgba(255, 255, 255, 0.75);
    box-shadow: 0 0 0 1.5px #d92638;
  }
  .cap-1 { left: 82px;  top: 634px; }
  .cap-2 { left: 261px; top: 634px; }
  .cap-3 { left: 439px; top: 634px; }
  .cap-4 { left: 82px;  top: 896px; }
  .cap-5 { left: 261px; top: 896px; }
  .cap-6 { left: 439px; top: 896px; }
</style>
</head>

<div class="app-container">
  <div class="controls">
    <div id="setupBox" style="background:#eff6ff; border:1px solid #bfdbfe; padding:10px; border-radius:10px; font-size:12px;">
      <b>배포용 단독 파일 생성:</b> 하단 글씨 눈을 끈 <b>bg.png</b>를 선택해 합치세요.<br>
      <button class="btn-pack" onclick="document.getElementById('bgLoader').click()">bg.png 선택해서 합치기</button>
      <input type="file" id="bgLoader" accept="image/png,image/jpeg" style="display:none;">
    </div>

    <div class="top-bar">
      <h2>증명사진 가이드라인</h2>
      <button class="btn-save" onclick="exportImage()">↓ 고화질 PNG 저장</button>
    </div>

    <div class="toolbar-row">
      <div class="color-group">
        <span>배경색</span>
        <input type="color" id="colTop" value="#ffffff" title="상단 색상">
        <span>→</span>
        <input type="color" id="colBot" value="#f3bcc6" title="하단 색상">
      </div>
      <button class="btn-toggle-text" onclick="document.getElementById('labelEditor').classList.toggle('open')">하단 문구 수정 ▾</button>
    </div>

    <div class="label-editor" id="labelEditor">
      <input type="text" data-cap="1" value="X 너무 가깝다">
      <input type="text" data-cap="2" value="X 너무 멀다">
      <input type="text" data-cap="3" value="X 자고 있다">
      <input type="text" data-cap="4" value="X 악세서리 착용">
      <input type="text" data-cap="5" value="X 식사중">
      <input type="text" data-cap="6" value="X 예전 사진">
    </div>

    <div class="tip-line">
      <b>터치/클릭:</b> 사진 넣기 · <b>드래그:</b> 이동 · <b>두 손가락/휠:</b> 확대·축소 · <b>더블터치:</b> 교체
    </div>
  </div>

  var previewScale = 1;

  function fitPosterToScreen() {
    var stage = document.getElementById('stage');
    var wrapper = document.getElementById('previewWrapper');
    var poster = document.getElementById('poster');
    var availW = stage.clientWidth || (document.documentElement.clientWidth - 24);
    var targetW = Math.min(availW, 520);
    previewScale = targetW / 680;
    poster.style.transform = 'scale(' + previewScale + ')';
    wrapper.style.width = Math.round(680 * previewScale) + 'px';
    wrapper.style.height = Math.round(980 * previewScale) + 'px';
  }
  window.addEventListener('DOMContentLoaded', fitPosterToScreen);
  window.addEventListener('load', fitPosterToScreen);
  window.addEventListener('resize', fitPosterToScreen);
  fitPosterToScreen();

  var bgImg = new Image();
  var posterBgEl = document.getElementById('posterBg');

  function applyBgData(dataUrl) {
    bgImg.src = dataUrl;
    posterBgEl.style.backgroundImage = 'url("' + dataUrl + '")';
  }

  if (EMBEDDED_BG) {
    applyBgData(EMBEDDED_BG);
    document.getElementById('setupBox').style.display = 'none';
  } else {
    posterBgEl.style.backgroundImage = 'url("./bg.png")';
    bgImg.src = './bg.png';
  }

  document.getElementById('bgLoader').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      applyBgData(dataUrl);
      var fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      fullHtml = fullHtml.replace('var EMBEDDED_BG = "";', 'var EMBEDDED_BG = "' + dataUrl + '";');
      var blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    };
    reader.readAsDataURL(file);
  });

  document.querySelectorAll('.label-editor input').forEach(function(inp) {
    var id = inp.dataset.cap;
    var view = document.querySelector('[data-cap-view="' + id + '"]');
    inp.addEventListener('input', function() { view.textContent = inp.value; });
    view.addEventListener('input', function() { inp.value = view.textContent; });
  });

  var colTopInput = document.getElementById('colTop');
  var colBotInput = document.getElementById('colBot');

  function updateBG() {
    document.getElementById('poster').style.background = 'linear-gradient(to bottom, ' + colTopInput.value + ' 0%, ' + colBotInput.value + ' 100%)';
  }
  colTopInput.addEventListener('input', updateBG);
  colBotInput.addEventListener('input', updateBG);
  updateBG();

  var fileInput = document.getElementById('fileInput');
  var activeSlot = null;
  var slotStates = {};

  document.querySelectorAll('.photo-slot').forEach(function(slot) {
    var id = slot.dataset.slot;
    slotStates[id] = { x: 0, y: 0, scale: 1, img: null };

    slot.addEventListener('click', function() {
      if (!slotStates[id].img) {
        activeSlot = slot;
        fileInput.click();
      }
    });

    slot.addEventListener('dblclick', function() {
      activeSlot = slot;
      fileInput.click();
    });

    var lastTap = 0;
    slot.addEventListener('touchend', function(e) {
      if (e.touches.length === 0 && slotStates[id].img) {
        var now = Date.now();
        if (now - lastTap < 300) {
          activeSlot = slot;
          fileInput.click();
        }
        lastTap = now;
      }
    });

    slot.addEventListener('wheel', function(e) {
      var st = slotStates[id];
      if (!st.img) return;
      e.preventDefault();
      var factor = e.deltaY < 0 ? 1.1 : 0.9;
      st.scale = Math.min(Math.max(0.02, st.scale * factor), 8);
      updateTransform(id);
    }, { passive: false });
  });

  fileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file || !activeSlot) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var id = activeSlot.dataset.slot;
      var img = new Image();
      img.onload = function() {
        activeSlot.innerHTML = '';
        activeSlot.appendChild(img);
        var slotW = activeSlot.clientWidth;
        var slotH = activeSlot.clientHeight;
        var fitScale = Math.max(slotW / img.naturalWidth, slotH / img.naturalHeight);
        slotStates[id] = { x: 0, y: 0, scale: fitScale, img: img };
        updateTransform(id);
        enableDragAndPinch(img, activeSlot, id);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  function updateTransform(id) {
    var st = slotStates[id];
    if (!st.img) return;
    st.img.style.transform = 'translate(' + st.x + 'px, ' + st.y + 'px) scale(' + st.scale + ')';
  }

  function enableDragAndPinch(img, slot, id) {
    var dragging = false, startX = 0, startY = 0;
    var pinching = false, startDist = 0, startScale = 1;

    img.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      startX = e.clientX / previewScale - slotStates[id].x;
      startY = e.clientY / previewScale - slotStates[id].y;
    });
    window.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      slotStates[id].x = e.clientX / previewScale - startX;
      slotStates[id].y = e.clientY / previewScale - startY;
      updateTransform(id);
    });
    window.addEventListener('mouseup', function() { dragging = false; });

    slot.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        dragging = true;
        pinching = false;
        startX = e.touches[0].clientX / previewScale - slotStates[id].x;
        startY = e.touches[0].clientY / previewScale - slotStates[id].y;
      } else if (e.touches.length === 2) {
        dragging = false;
        pinching = true;
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        startDist = Math.hypot(dx, dy);
        startScale = slotStates[id].scale;
      }
    }, { passive: false });

    slot.addEventListener('touchmove', function(e) {
      if (dragging && e.touches.length === 1) {
        e.preventDefault();
        slotStates[id].x = e.touches[0].clientX / previewScale - startX;
        slotStates[id].y = e.touches[0].clientY / previewScale - startY;
        updateTransform(id);
      } else if (pinching && e.touches.length === 2) {
        e.preventDefault();
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.hypot(dx, dy);
        if (startDist > 0) {
          slotStates[id].scale = Math.min(Math.max(0.02, startScale * (dist / startDist)), 8);
          updateTransform(id);
        }
      }
    }, { passive: false });

    slot.addEventListener('touchend', function() {
      dragging = false;
      pinching = false;
    });
  }

  function drawTightText(ctx, text, x, y, letterSpacing, scaleX) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, 1);
    var chars = Array.from(text);
    var widths = chars.map(function(ch) { return ctx.measureText(ch).width; });
    var totalW = widths.reduce(function(a, b) { return a + b; }, 0) + letterSpacing * (chars.length - 1);
    var curX = -totalW / 2;
    ctx.textAlign = 'left';
    chars.forEach(function(ch, idx) {
      ctx.fillText(ch, curX, 0);
      curX += widths[idx] + letterSpacing;
    });
    ctx.restore();
  }

  function exportImage() {
    var scale = 2;
    var W = 680 * scale;
    var H = 980 * scale;
    var canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, colTopInput.value);
    grad.addColorStop(1, colBotInput.value);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(bgImg, 0, 0, W, H);
    ctx.restore();

    var slotCoords = [
      { l: 403, t: 35,  w: 245, h: 310 },
      { l: 82,  t: 421, w: 162, h: 205 },
      { l: 261, t: 421, w: 162, h: 205 },
      { l: 439, t: 421, w: 162, h: 205 },
      { l: 82,  t: 683, w: 162, h: 205 },
      { l: 261, t: 683, w: 162, h: 205 },
      { l: 439, t: 683, w: 162, h: 205 }
    ];

    slotCoords.forEach(function(c, id) {
      var st = slotStates[id];
      var sx = c.l * scale;
      var sy = c.t * scale;
      var sw = c.w * scale;
      var sh = c.h * scale;

      ctx.save();
      ctx.beginPath();
      ctx.rect(sx, sy, sw, sh);
      ctx.clip();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx, sy, sw, sh);

      if (st && st.img) {
        var iw = st.img.naturalWidth * st.scale * scale;
        var ih = st.img.naturalHeight * st.scale * scale;
        var cx = sx + sw / 2 + st.x * scale - iw / 2;
        var cy = sy + sh / 2 + st.y * scale - ih / 2;
        ctx.drawImage(st.img, cx, cy, iw, ih);
      }
      ctx.restore();
    });

    var capCoords = [
      { l: 82,  t: 634 },
      { l: 261, t: 634 },
      { l: 439, t: 634 },
      { l: 82,  t: 896 },
      { l: 261, t: 896 },
      { l: 439, t: 896 }
    ];

    document.querySelectorAll('.caption-box').forEach(function(box, idx) {
      var c = capCoords[idx];
      var textVal = box.textContent.trim();
      ctx.fillStyle = '#111';
      ctx.font = '900 ' + (19 * scale) + 'px "Pretendard", "Malgun Gothic", sans-serif';
      ctx.textBaseline = 'middle';
      drawTightText(
        ctx,
        textVal,
        (c.l + 81) * scale,
        (c.t + 13) * scale,
        -1.4 * scale,
        0.96
      );
    });

    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.download = '증명사진_가이드라인.png';
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }, 'image/png');
  }
</script>

</body></html>
